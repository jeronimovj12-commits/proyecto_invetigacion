{% extends "base.html" %}
{% block titulo %}Iniciar sesión · Módulo de Investigación{% endblock %}
{% block contenido %}
<div class="login-layout">
  <section class="card login-card shadow-sm border-0">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <img class="login-logo mb-3" src="{{ url_for('static', filename='logo-horizontal.png') }}" alt="Universidad Monte Verde">
        <p class="text-uppercase small fw-semibold text-umv-green mb-2">Universidad Monte Verde</p>
        <h1 class="h3 mb-0">Iniciar sesión</h1>
      </div>
      <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="siguiente" value="{{ request.args.get('siguiente', request.form.get('siguiente', '')) }}">
        <div class="mb-3">
          <label class="form-label" for="username">Usuario</label>
          <input class="form-control form-control-lg" id="username" name="username"
                 maxlength="100" required autocomplete="username"
                 value="{{ request.form.get('username', '') }}">
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-control form-control-lg" id="password" name="password"
                 type="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-lg w-100" type="submit">Ingresar</button>
      </form>
    </div>
  </section>
</div>
{% endblock %}
