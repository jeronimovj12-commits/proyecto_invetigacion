{% extends 'base.html' %}
{% block contenido %}
<h1>Iniciar sesión</h1>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Usuario <input name="username" required maxlength="100" autocomplete="username"></label>
<label>Contraseña <input type="password" name="password" required maxlength="1024" autocomplete="current-password"></label>
<button type="submit">Entrar</button>
</form>
{% endblock %}
