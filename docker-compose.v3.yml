# Instalación aislada: no usa investigacion_local ni los volúmenes de v2.
# Configura la clave services con el valor o bloque indicado.
services:
  # Configura la clave postgres-v3 con el valor o bloque indicado.
  postgres-v3:
    # Configura la clave image con el valor o bloque indicado.
    image: postgres:16
    # Configura la clave environment con el valor o bloque indicado.
    environment:
      # Configura la clave POSTGRES_USER con el valor o bloque indicado.
      POSTGRES_USER: investigacion_v3
      # Configura la clave POSTGRES_DB con el valor o bloque indicado.
      POSTGRES_DB: investigacion_v3
      # Configura la clave POSTGRES_PASSWORD con el valor o bloque indicado.
      POSTGRES_PASSWORD: ${V3_DB_PASSWORD:?Configure V3_DB_PASSWORD fuera de Git}
    # Configura la clave volumes con el valor o bloque indicado.
    volumes:
      # Agrega este elemento a la lista de configuracion actual.
      - pgdata-v3:/var/lib/postgresql/data
      # Agrega este elemento a la lista de configuracion actual.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Agrega este elemento a la lista de configuracion actual.
      - ./db/migraciones:/migraciones:ro
    # Configura la clave healthcheck con el valor o bloque indicado.
    healthcheck:
      # Configura la clave test con el valor o bloque indicado.
      test: [CMD-SHELL, 'pg_isready -U investigacion_v3 -d investigacion_v3']
      # Configura la clave interval con el valor o bloque indicado.
      interval: 2s
      # Configura la clave timeout con el valor o bloque indicado.
      timeout: 3s
      # Configura la clave retries con el valor o bloque indicado.
      retries: 30
  # Aplica la migracion una vez y evita que la API arranque antes de completarla.
  # Configura la clave migrar-v3 con el valor o bloque indicado.
  migrar-v3:
    # Configura la clave image con el valor o bloque indicado.
    image: postgres:16
    # Configura la clave environment con el valor o bloque indicado.
    environment:
      # Configura la clave PGPASSWORD con el valor o bloque indicado.
      PGPASSWORD: ${V3_DB_PASSWORD:?}
    # Configura la clave volumes con el valor o bloque indicado.
    volumes:
      # Agrega este elemento a la lista de configuracion actual.
      - ./db/migraciones:/migraciones:ro
    # Configura la clave command con el valor o bloque indicado.
    command: psql -X -v ON_ERROR_STOP=1 -h postgres-v3 -U investigacion_v3 -d investigacion_v3 -f /migraciones/v3_001_sesiones_asignaciones.sql
    # Configura la clave depends_on con el valor o bloque indicado.
    depends_on:
      # Configura la clave postgres-v3 con el valor o bloque indicado.
      postgres-v3:
        # Configura la clave condition con el valor o bloque indicado.
        condition: service_healthy
  # Configura la clave api-v3 con el valor o bloque indicado.
  api-v3:
    # Configura la clave build con el valor o bloque indicado.
    build:
      # Configura la clave context con el valor o bloque indicado.
      context: ./api_investigacion
      # Configura la clave args con el valor o bloque indicado.
      args:
        # Configura la clave ARCHIVO_REQUISITOS con el valor o bloque indicado.
        ARCHIVO_REQUISITOS: requirements-v3.lock
    # Configura la clave command con el valor o bloque indicado.
    command: uvicorn main_v3:app --host 0.0.0.0 --port 8025 --no-access-log
    # Configura la clave ports con el valor o bloque indicado.
    ports:
      # Agrega este elemento a la lista de configuracion actual.
      - '127.0.0.1:8026:8025'
    # Configura la clave environment con el valor o bloque indicado.
    environment:
      # Configura la clave DB_POSTGRES con el valor o bloque indicado.
      DB_POSTGRES: postgresql+asyncpg://investigacion_v3:${V3_DB_PASSWORD:?}@postgres-v3:5432/investigacion_v3
      # Configura la clave JWT_SECRET con el valor o bloque indicado.
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET fuera de Git}
      # Configura la clave JWT_ISSUER con el valor o bloque indicado.
      JWT_ISSUER: investigacion-v3
      # Configura la clave JWT_AUDIENCE con el valor o bloque indicado.
      JWT_AUDIENCE: investigacion-api
      # Configura la clave JWT_MINUTOS con el valor o bloque indicado.
      JWT_MINUTOS: ${JWT_MINUTOS:-30}
    # Configura la clave volumes con el valor o bloque indicado.
    volumes:
      # Agrega este elemento a la lista de configuracion actual.
      - ./api_investigacion:/app
      # Agrega este elemento a la lista de configuracion actual.
      - ./db:/db-v3:ro
    # Configura la clave depends_on con el valor o bloque indicado.
    depends_on:
      # Configura la clave postgres-v3 con el valor o bloque indicado.
      postgres-v3:
        # Configura la clave condition con el valor o bloque indicado.
        condition: service_healthy
      # La API requiere las columnas nuevas que instala el servicio de migracion.
      # Configura la clave migrar-v3 con el valor o bloque indicado.
      migrar-v3:
        # Configura la clave condition con el valor o bloque indicado.
        condition: service_completed_successfully
  # Configura la clave front-v3 con el valor o bloque indicado.
  front-v3:
    # Configura la clave build con el valor o bloque indicado.
    build:
      # Configura la clave context con el valor o bloque indicado.
      context: ./front_flask
      # Configura la clave args con el valor o bloque indicado.
      args:
        # Configura la clave ARCHIVO_REQUISITOS con el valor o bloque indicado.
        ARCHIVO_REQUISITOS: requirements-v3.lock
    # Configura la clave command con el valor o bloque indicado.
    command: python app_v3.py
    # Configura la clave ports con el valor o bloque indicado.
    ports:
      # Agrega este elemento a la lista de configuracion actual.
      - '127.0.0.1:8079:8078'
    # Configura la clave environment con el valor o bloque indicado.
    environment:
      # Configura la clave URL_API_INVESTIGACION con el valor o bloque indicado.
      URL_API_INVESTIGACION: http://api-v3:8025
      # Configura la clave CLAVE_SESION con el valor o bloque indicado.
      CLAVE_SESION: ${CLAVE_SESION:?Configure CLAVE_SESION fuera de Git}
      # Configura la clave COOKIE_SECURE con el valor o bloque indicado.
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # Configura la clave SESIONES_ARCHIVO con el valor o bloque indicado.
      SESIONES_ARCHIVO: /sesiones/sesiones.sqlite3
    # Configura la clave volumes con el valor o bloque indicado.
    volumes:
      # Agrega este elemento a la lista de configuracion actual.
      - ./front_flask:/app
      # Agrega este elemento a la lista de configuracion actual.
      - sesiones-v3:/sesiones
# Configura la clave volumes con el valor o bloque indicado.
volumes:
  # Configura la clave sesiones-v3 con el valor o bloque indicado.
  sesiones-v3:
  # Configura la clave pgdata-v3 con el valor o bloque indicado.
  pgdata-v3:
