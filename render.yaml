# Render Blueprint de demostración; crea dos servicios web y una base PostgreSQL.
services:
  # API pública protegida por autenticación y permisos en cada ruta.
  - type: web
    name: investigacion-api-v3-demo
    runtime: docker
    plan: free
    region: virginia
    branch: v3-desarrollo
    dockerfilePath: ./api_investigacion/Dockerfile.render
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: investigacion-postgres-v3-demo
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: investigacion-v3
      - key: JWT_AUDIENCE
        value: investigacion-api
      - key: JWT_MINUTOS
        value: "30"
      - key: RENDER_PUBLIC_API
        value: "1"

  # Front Flask público; Render termina HTTPS y el front activa cookies seguras.
  - type: web
    name: investigacion-front-v3-demo
    runtime: docker
    plan: free
    region: virginia
    branch: v3-desarrollo
    dockerfilePath: ./front_flask/Dockerfile.render
    dockerContext: ./front_flask
    healthCheckPath: /login
    envVars:
      - key: URL_API_INVESTIGACION
        fromService:
          type: web
          name: investigacion-api-v3-demo
          envVarKey: RENDER_EXTERNAL_URL
      - key: CLAVE_SESION
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: TIEMPO_MAXIMO
        value: "75"
      - key: SESIONES_ARCHIVO
        value: /tmp/investigacion-v3/sesiones.sqlite3

# El plan gratuito sirve para demostraciones y elimina la base al vencer a los 30 días.
databases:
  - name: investigacion-postgres-v3-demo
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    databaseName: investigacion_v3
    user: investigacion_v3
