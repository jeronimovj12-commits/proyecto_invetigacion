databases:
  - name: investigacion-v3-db
    databaseName: investigacion_v3
    user: investigacion_v3
    plan: free
    region: ohio
    postgresMajorVersion: "16"

services:
  - type: web
    name: investigacion-v3-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./api_investigacion/Dockerfile.render
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: DB_POSTGRES
        fromDatabase:
          name: investigacion-v3-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: investigacion-v3
      - key: JWT_AUDIENCE
        value: investigacion-api
      - key: JWT_MINUTOS
        value: "30"
      - key: RENDER_PUBLIC_API
        value: "1"

  - type: web
    name: investigacion-v3-front
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./front_flask/Dockerfile
    dockerContext: ./front_flask
    autoDeployTrigger: commit
    healthCheckPath: /login
    envVars:
      - key: URL_API_INVESTIGACION
        fromService:
          name: investigacion-v3-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CLAVE_SESION
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: TIEMPO_MAXIMO
        value: "75"
      - key: SESIONES_ARCHIVO
        value: /tmp/investigacion-v3/sesiones.sqlite3
