# Solo pruebas: otra base aleatoria, sin publicar puertos ni usar cuentas reales.
# Configura la clave services con el valor o bloque indicado.
services:
  # Configura la clave pruebas-api-v3 con el valor o bloque indicado.
  pruebas-api-v3:
    # Configura la clave build con el valor o bloque indicado.
    build:
      # Configura la clave context con el valor o bloque indicado.
      context: ./api_investigacion
      # Configura la clave args con el valor o bloque indicado.
      args:
        # Configura la clave ARCHIVO_REQUISITOS con el valor o bloque indicado.
        ARCHIVO_REQUISITOS: requirements-v3.lock
    # Configura la clave command con el valor o bloque indicado.
    command: python pruebas/servidor_integracion_v3.py
    # Configura la clave environment con el valor o bloque indicado.
    environment:
      # Configura la clave PRUEBAS_V3 con el valor o bloque indicado.
      PRUEBAS_V3: '1'
      # Configura la clave DB_POSTGRES con el valor o bloque indicado.
      DB_POSTGRES: postgresql+asyncpg://investigacion_v3:${V3_DB_PASSWORD:?}@postgres-v3:5432/investigacion_v3
      # Configura la clave JWT_SECRET con el valor o bloque indicado.
      JWT_SECRET: ${JWT_SECRET:?}
      # Configura la clave JWT_ISSUER con el valor o bloque indicado.
      JWT_ISSUER: investigacion-v3
      # Configura la clave JWT_AUDIENCE con el valor o bloque indicado.
      JWT_AUDIENCE: investigacion-api
    # Configura la clave volumes con el valor o bloque indicado.
    volumes:
      # Agrega este elemento a la lista de configuracion actual.
      - ./api_investigacion:/app
      # Agrega este elemento a la lista de configuracion actual.
      - ./db:/db-v3:ro
      # Agrega este elemento a la lista de configuracion actual.
      - fixture-v3:/fixture
    # Configura la clave depends_on con el valor o bloque indicado.
    depends_on:
      # Configura la clave postgres-v3 con el valor o bloque indicado.
      postgres-v3:
        # Configura la clave condition con el valor o bloque indicado.
        condition: service_healthy
    # Configura la clave healthcheck con el valor o bloque indicado.
    healthcheck:
      # Configura la clave test con el valor o bloque indicado.
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8031/')"]
      # Configura la clave interval con el valor o bloque indicado.
      interval: 2s
      # Configura la clave timeout con el valor o bloque indicado.
      timeout: 3s
      # Configura la clave retries con el valor o bloque indicado.
      retries: 30
  # Configura la clave pruebas-front-v3 con el valor o bloque indicado.
  pruebas-front-v3:
    # Configura la clave build con el valor o bloque indicado.
    build:
      # Configura la clave context con el valor o bloque indicado.
      context: ./front_flask
      # Configura la clave args con el valor o bloque indicado.
      args:
        # Configura la clave ARCHIVO_REQUISITOS con el valor o bloque indicado.
        ARCHIVO_REQUISITOS: requirements-v3.lock
    # Configura la clave command con el valor o bloque indicado.
    command: python -m unittest discover -s pruebas -p prueba_integracion_v3.py -v
    # Configura la clave environment con el valor o bloque indicado.
    environment:
      # Configura la clave URL_API_INVESTIGACION con el valor o bloque indicado.
      URL_API_INVESTIGACION: http://pruebas-api-v3:8031
      # Configura la clave CLAVE_SESION con el valor o bloque indicado.
      CLAVE_SESION: ${CLAVE_SESION:?}
      # Configura la clave SESIONES_ARCHIVO con el valor o bloque indicado.
      SESIONES_ARCHIVO: /tmp/pruebas-front/sesiones.sqlite3
    # Configura la clave volumes con el valor o bloque indicado.
    volumes:
      # Agrega este elemento a la lista de configuracion actual.
      - ./front_flask:/app
      # Agrega este elemento a la lista de configuracion actual.
      - fixture-v3:/fixture:ro
    # Configura la clave depends_on con el valor o bloque indicado.
    depends_on:
      # Configura la clave pruebas-api-v3 con el valor o bloque indicado.
      pruebas-api-v3:
        # Configura la clave condition con el valor o bloque indicado.
        condition: service_healthy
# Configura la clave volumes con el valor o bloque indicado.
volumes:
  # Configura la clave fixture-v3 con el valor o bloque indicado.
  fixture-v3:
