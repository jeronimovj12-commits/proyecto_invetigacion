services:
  postgres:
    image: postgres:16
    container_name: paradigmas-investigacion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "15440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api-investigacion:
    build: ./api_investigacion
    container_name: paradigmas-investigacion-api
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8025 --reload
    ports:
      - "8025:8025"
    volumes:
      - ./api_investigacion:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
    depends_on:
      postgres:
        condition: service_healthy

  front-flask:
    build: ./front_flask
    container_name: paradigmas-investigacion-front
    restart: unless-stopped
    ports:
      - "8078:8078"
    volumes:
      - ./front_flask:/app
    environment:
      URL_API_INVESTIGACION: ${URL_API_INVESTIGACION}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}

volumes:
  pgdata:
